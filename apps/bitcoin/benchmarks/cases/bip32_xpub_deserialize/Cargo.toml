[package]
name = "bench-xpub_deserialize"
version = "0.1.0"
edition = "2021"

[package.metadata.vapp]
name = "Deserialize Xpub"
stack_size = 65536

[package.metadata.benchmark]
repetitions = 10

[features]
default = ["target_native"]
target_native = ["sdk/target_native"]
target_vanadium_ledger = ["sdk/target_vanadium_ledger"]

[dependencies]
# The upper bounds here keep us off the `*.101` shim line that upstream rust-bitcoin
# published (bitcoin 0.32.101+, bitcoin_hashes 0.14.101, base58ck 0.1.101). Our vendored
# forks in libs/ are versioned below it, so without the bounds cargo prefers the registry
# crates, silently drops the [patch] entries below, and the benchmark ends up measuring
# upstream software crypto (including the C secp256k1-sys) instead of the VM's ecalls.
# `hashes` and `base58` are not used directly; they are declared only to bound the
# versions that `bitcoin` pulls in, matching what the app and vnd-bitcoin-common resolve.
bitcoin = { version = ">=0.32.0, <0.32.100", features = ["serde"], default-features = false }
hashes = { package = "bitcoin_hashes", version = ">=0.14.0, <0.14.100", default-features = false, features = ["alloc", "io"] }
base58 = { package = "base58ck", version = ">=0.1.0, <0.1.100", default-features = false }
hex-literal = "0.4.1"
sdk = { package = "vanadium-app-sdk", path = "../../../../../app-sdk", default-features = false }

[workspace]

[patch.crates-io.bitcoin_hashes]
path = "../../../../../libs/bitcoin_hashes"
[patch.crates-io.secp256k1]
path = "../../../../../libs/secp256k1"
[patch.crates-io.base58ck]
path = "../../../../../libs/base58"
[patch.crates-io.getrandom]
path = "../../../../../libs/getrandom"
