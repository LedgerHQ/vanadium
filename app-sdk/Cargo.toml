[package]
name = "vanadium-app-sdk"
version = "0.1.0"
edition.workspace = true

[dependencies]
common = { path = "../common", default-features = false }
critical-section = "1.1.2"
subtle = { version="2.6.1", default-features = false }
hex-literal = "0.4.1"
vanadium_macros = { path = "../macros" }
zeroize = "1.8.1"

# target_vanadium_ledger dependencies (optional)
embedded-alloc = { version = "0.5.1", optional = true }
vanadium-ecalls = { path = "../ecalls", default-features = false, optional = true }

# target_native dependencies (optional)
bip32 = { version = "0.5.2", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.12.1", optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "ecdsa-core", "schnorr"], optional = true }
lazy_static = { version = "1.5.0", optional = true }
num-bigint = { version = "0.4.6", optional = true }
num-traits = { version = "0.2.19", optional = true }
# Verification-only curves. The host implementations of the curve ECALLs need one crate per
# curve: the k256/p256/p384 point and scalar types are distinct, even though their traits match.
p256 = { version = "0.13.2", default-features = false, features = ["alloc", "arithmetic", "ecdsa"], optional = true }
p384 = { version = "0.13.1", default-features = false, features = ["alloc", "arithmetic", "ecdsa"], optional = true }
rand = { version = "0.9.1", optional = true }
ripemd = { version = "0.1.3", optional = true }
sha2 = { version = "0.10.8", optional = true }
sha3 = { version = "0.10", optional = true }

[features]
default = ["target_native"]
target_native = [
    "common/target_native",
    "dep:bip32",
    "dep:hex",
    "dep:hmac",
    "dep:k256",
    "dep:lazy_static",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:p256",
    "dep:p384",
    "dep:rand",
    "dep:ripemd",
    "dep:sha2",
    "dep:sha3",
]
target_vanadium_ledger = [
    "common/target_vanadium_ledger",
    "dep:embedded-alloc",
    "vanadium-ecalls/target_vanadium_ledger",
]

# Enable this in V-App's dev-dependencies
test-mode = [] 

[dev-dependencies]
serde_json = "1"

[build-dependencies]
common = { path = "../common", features = ["wrapped_serializable"] }
